<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPW COIN SERVICES BOT - Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; margin: 0; padding: 20px; color: #fff; min-height: 100vh; }
        .container { max-width: 480px; margin: 30px auto; background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .dev-credit { text-align: center; color: #64748b; font-size: 11px; margin-bottom: 20px; text-transform: uppercase; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 10px; font-size: 15px; }
        input { background: #0f172a; color: #fff; border: 1px solid #334155; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        .pkg-card { background: #0f172a; padding: 14px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .pkg-card button { width: auto; padding: 8px 16px; background: #10b981; color: #fff; }
        .badge { background: #10b981; color: white; padding: 4px 12px; border-radius: 15px; font-weight: bold; }
        .hidden { display: none; }
        .user-box { background: #0f172a; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .switch-btn { background: #ec4899; color: #fff; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>JPW COIN SERVICES BOT</h2>
    <div class="dev-credit">Developed by tenaga technology</div>

    <div id="web-login-screen" class="hidden">
        <h3 style="text-align: center;">Web Login via Telegram ID</h3>
        <input type="text" id="webChatIdInput" placeholder="Enter Telegram Chat ID">
        <button onclick="requestOtp()">📩 Send OTP</button>
        <p id="loginMsg" style="color:#f87171; text-align:center; font-weight:bold;"></p>
    </div>

    <div id="otp-verify-screen" class="hidden">
        <h3 style="text-align: center;">Enter 6-digit OTP</h3>
        <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6" style="text-align:center; font-size:18px;">
        <button onclick="verifyOtp()">🔐 Verify & Login</button>
        <p id="otpMsg" style="color:#f87171; text-align:center; font-weight:bold;"></p>
    </div>

    <div id="dashboard-screen" class="hidden">
        <div class="user-box">
            <p>👤 <b>Name:</b> <span id="userName" style="color: #38bdf8;"></span></p>
            <p>💬 <b>Chat ID:</b> <span id="dispChatId"></span></p>
            <p>🪙 <b>JPW Coins:</b> <span id="userBalance" class="badge">0</span></p>
            <button onclick="logout()" style="background: #ef4444; color: #fff; width:auto; padding:6px 16px;">🚪 Logout</button>
        </div>

        <button id="switchServiceBtn" onclick="toggleServiceMode()" class="switch-btn">🛠️ Switch to SR Service</button>

        <h3>📦 Recharge Packages</h3>
        <div id="packages-list"></div>

        <div id="website-order-section">
            <h3 style="margin-top:20px; color: #38bdf8;">⚡ Website Order (Cost: 1 Coin)</h3>
            <input type="text" id="targetId" placeholder="Target Username / ID">
            <input type="password" id="targetPass" placeholder="Target Password">
            <button onclick="submitOrder()">🚀 Submit Website Order</button>
            <p id="orderMsg" style="text-align:center; font-weight:bold;"></p>
        </div>

        <div id="sr-order-section" class="hidden">
            <h3 style="margin-top:20px; color: #ec4899;">🛠️ SR Service Request (Cost: 1 Coin)</h3>
            <input type="text" id="srMobile" placeholder="Customer Mobile Number">
            <input type="text" id="srLandline" placeholder="Customer Landline Number">
            <input type="text" id="srCustomerName" placeholder="Customer Name">
            <button onclick="submitSrOrder()" style="background: #ec4899; color: #fff;">🚀 Submit SR Request</button>
            <p id="srOrderMsg" style="text-align:center; font-weight:bold;"></p>
        </div>
    </div>
</div>

<script>
    let telegramChatId = localStorage.getItem('jpw_chat_id') || '';
    let userName = 'User';
    let currentMode = 'website';

    function toggleServiceMode() {
        const webSection = document.getElementById('website-order-section');
        const srSection = document.getElementById('sr-order-section');
        const switchBtn = document.getElementById('switchServiceBtn');
        if(currentMode === 'website') {
            currentMode = 'sr';
            webSection.classList.add('hidden');
            srSection.classList.remove('hidden');
            switchBtn.innerText = "🌐 Switch to Website Order";
            switchBtn.style.background = "#38bdf8";
            switchBtn.style.color = "#0f172a";
        } else {
            currentMode = 'website';
            srSection.classList.add('hidden');
            webSection.classList.remove('hidden');
            switchBtn.innerText = "🛠️ Switch to SR Service";
            switchBtn.style.background = "#ec4899";
            switchBtn.style.color = "#fff";
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const tg = window.Telegram.WebApp;
        tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('payment') === 'success') {
            const chatId = urlParams.get('telegramChatId');
            const coins = urlParams.get('coins');
            const orderId = urlParams.get('order_id');
            if (chatId && coins) {
                await fetch('/api/verify-instant', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ telegramChatId: chatId, coins, order_id: orderId })
                });
                alert(`🎉 Payment Successful! ${coins} Coins added.`);
                window.location.href = '/';
                return;
            }
        }
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
            telegramChatId = String(tg.initDataUnsafe.user.id);
            userName = tg.initDataUnsafe.user.first_name || 'User';
            localStorage.setItem('jpw_chat_id', telegramChatId);
            authenticateMiniApp(telegramChatId, userName);
        } else if (telegramChatId) {
            authenticateMiniApp(telegramChatId, 'Web User');
        } else {
            document.getElementById('web-login-screen').classList.remove('hidden');
        }
    });

    let tempChatId = '';
    async function requestOtp() {
        tempChatId = document.getElementById('webChatIdInput').value.trim();
        const res = await fetch('/api/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId: tempChatId }) });
        const data = await res.json();
        if(data.success) {
            document.getElementById('web-login-screen').classList.add('hidden');
            document.getElementById('otp-verify-screen').classList.remove('hidden');
        } else { document.getElementById('loginMsg').innerText = data.message; }
    }

    async function verifyOtp() {
        const otp = document.getElementById('otpInput').value.trim();
        const res = await fetch('/api/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId: tempChatId, otp }) });
        const data = await res.json();
        if(data.success) {
            telegramChatId = data.user.telegramChatId;
            userName = data.user.name;
            localStorage.setItem('jpw_chat_id', telegramChatId);
            document.getElementById('otp-verify-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('userName').innerText = data.user.name;
            document.getElementById('dispChatId').innerText = data.user.telegramChatId;
            document.getElementById('userBalance').innerText = data.user.coins.toFixed(4);
            loadPackages();
        } else { document.getElementById('otpMsg').innerText = data.message; }
    }

    async function authenticateMiniApp(chatId, name) {
        const res = await fetch('/api/mini-app/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId: chatId, name }) });
        const data = await res.json();
        if(data.success) {
            document.getElementById('web-login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('userName').innerText = data.user.name;
            document.getElementById('dispChatId').innerText = data.user.telegramChatId;
            document.getElementById('userBalance').innerText = data.user.coins.toFixed(4);
            loadPackages();
        } else { localStorage.removeItem('jpw_chat_id'); document.getElementById('web-login-screen').classList.remove('hidden'); }
    }

    async function loadPackages() {
        const res = await fetch('/api/packages');
        const data = await res.json();
        let html = '';
        data.packages.forEach(pkg => {
            html += `<div class="pkg-card"><span>₹${pkg.amount} ➡️ <b>${pkg.coins} Coins</b></span><button onclick="buyPackage(${pkg.amount}, ${pkg.coins})">Pay</button></div>`;
        });
        document.getElementById('packages-list').innerHTML = html;
    }

    async function buyPackage(amount, coins) {
        const res = await fetch('/api/pay', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId, amount, coins }) });
        const data = await res.json();
        if(data.success) {
            const cashfree = Cashfree({ mode: "production" });
            cashfree.checkout({ paymentSessionId: data.paymentSessionId, redirectTarget: "_self" });
        } else { alert(data.message); }
    }

    async function submitOrder() {
        const targetId = document.getElementById('targetId').value.trim();
        const targetPass = document.getElementById('targetPass').value.trim();
        const res = await fetch('/api/order', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId, targetId, targetPass }) });
        const data = await res.json();
        document.getElementById('orderMsg').innerText = data.message;
        if(data.success) authenticateMiniApp(telegramChatId, userName);
    }

    async function submitSrOrder() {
        const srMobile = document.getElementById('srMobile').value.trim();
        const srLandline = document.getElementById('srLandline').value.trim();
        const srCustomerName = document.getElementById('srCustomerName').value.trim();
        const res = await fetch('/api/sr-order', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegramChatId, srMobile, srLandline, srCustomerName }) });
        const data = await res.json();
        document.getElementById('srOrderMsg').innerText = data.message;
        if(data.success) authenticateMiniApp(telegramChatId, userName);
    }

    function logout() { localStorage.removeItem('jpw_chat_id'); location.reload(); }
</script>
</body>
</html>
