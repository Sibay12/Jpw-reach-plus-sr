<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - JPW</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #fff; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #111827; padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.08); }
        h2, h3 { color: #38bdf8; text-align: center; }
        input, button, textarea { padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #fff; width: 100%; box-sizing: border-box; font-size: 14px; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; width: auto; }
        button:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #374151; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #1f2937; color: #38bdf8; }
        .hidden { display: none; }
        .danger { background: #dc3545; }
        .success { background: #10b981; }
        .warning { background: #f59e0b; color: #000; }
        .card { background: #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
<div class="container">
    <h2>👑 Admin Control Center</h2>

    <div id="login-box" class="card" style="max-width:350px; margin:40px auto;">
        <h3>Admin Login</h3>
        <input type="password" id="adminPass" placeholder="Admin Password">
        <button onclick="login()" style="width:100%; margin-top:10px;">Login</button>
        <p id="errMsg" style="color:#f87171; text-align:center; font-weight:bold; margin-top:8px;"></p>
    </div>

    <div id="dash-box" class="hidden">
        <h3>📦 Customer Orders & SR Requests</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Telegram ID</th>
                        <th>Service Details</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-tbl"></tbody>
            </table>
        </div>

        <h3 style="margin-top: 30px;">👥 Registered Users Management (Coin / Reaches Control)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Telegram ID</th>
                        <th>Customer Name</th>
                        <th>Current Balance</th>
                        <th>Manage Coins & Delete</th>
                    </tr>
                </thead>
                <tbody id="users-tbl"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function login() {
        const password = document.getElementById('adminPass').value;
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if(data.success) {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-box').classList.remove('hidden');
            loadData();
        } else {
            document.getElementById('errMsg').innerText = data.message;
        }
    }

    async function loadData() {
        const res = await fetch('/api/admin/data');
        const data = await res.json();

        // Render Orders
        let ordersHtml = '';
        data.orders.forEach(ord => {
            let details = ord.serviceType === 'SR' ? `[SR] Mobile: ${ord.srMobile}` : `[Web] ID: ${ord.targetId}`;
            ordersHtml += `<tr>
                <td><code>${ord.telegramChatId}</code></td>
                <td>${details}</td>
                <td><b>${ord.status}</b></td>
                <td>
                    <button class="success" onclick="action('${ord._id}', 'accept')">Accept</button>
                    <button class="danger" onclick="action('${ord._id}', 'reject')">Reject</button>
                    <button class="success" onclick="action('${ord._id}', 'complete')">Complete</button>
                </td>
            </tr>`;
        });
        document.getElementById('orders-tbl').innerHTML = ordersHtml || `<tr><td colspan="4" style="text-align:center;">No orders</td></tr>`;

        // Render Users Management Table
        let usersHtml = '';
        data.users.forEach(usr => {
            usersHtml += `<tr>
                <td><code>${usr.telegramChatId}</code></td>
                <td><b>${usr.name || 'User'}</b></td>
                <td>${usr.coins.toFixed(4)} Coins</td>
                <td>
                    <input type="number" id="coin_val_${usr._id}" placeholder="Amount" style="width:90px; display:inline-block; padding:5px;" step="any">
                    <button class="success" style="padding:6px 10px;" onclick="modifyCoins('${usr._id}', 'add')">Add</button>
                    <button class="warning" style="padding:6px 10px;" onclick="modifyCoins('${usr._id}', 'sub')">Sub</button>
                    <button class="danger" style="padding:6px 10px;" onclick="deleteUser('${usr._id}')">Delete</button>
                </td>
            </tr>`;
        });
        document.getElementById('users-tbl').innerHTML = usersHtml || `<tr><td colspan="4" style="text-align:center;">No users</td></tr>`;
    }

    async function action(orderId, action) {
        await fetch('/api/admin/order-action', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ orderId, action })
        });
        loadData();
    }

    async function modifyCoins(userId, type) {
        const amount = document.getElementById(`coin_val_${userId}`).value.trim();
        if(!amount) return alert('Enter amount');
        const res = await fetch('/api/admin/modify-coins', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId, amount, type })
        });
        const data = await res.json();
        if(data.success) { alert('Updated successfully!'); loadData(); }
        else { alert(data.message); }
    }

    async function deleteUser(userId) {
        if(!confirm('Delete this user?')) return;
        const res = await fetch('/api/admin/delete-user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if(data.success) { alert('User deleted!'); loadData(); }
    }
</script>
</body>
</html>
